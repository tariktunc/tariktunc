<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="210">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
      .tag-text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #f1f5f9; }
      .subtag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="210" rx="16" fill="#090a0f" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.2" stroke="#334155" stroke-width="0.8">
    <line x1="0" y1="42" x2="860" y2="42" stroke-dasharray="4 4" />
    <line x1="0" y1="84" x2="860" y2="84" stroke-dasharray="4 4" />
    <line x1="0" y1="126" x2="860" y2="126" stroke-dasharray="4 4" />
    <line x1="0" y1="168" x2="860" y2="168" stroke-dasharray="4 4" />
  </g>

  <!-- Header Icon / Emblem -->
  <g transform="translate(36, 36)">
    <rect width="44" height="44" rx="10" fill="#f8fafc"/>
    <!-- Polaris 8-point geometric star -->
    <polygon points="22 8 25.5 17.5 35 18.5 28 25 30 34.5 22 29.5 14 34.5 16 25 9 18.5 18.5 17.5" fill="#090a0f"/>
  </g>

  <!-- Titles -->
  <g transform="translate(94, 52)">
    <text x="0" y="0" class="title">TARIK TUNÇ</text>
    <text x="0" y="24" class="desc">Yüksek Performanslı Masaüstü Sistemleri • Erişilebilirlik Mimarisi • Web Mühendisliği</text>
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(680, 40)">
    <rect width="144" height="26" rx="13" fill="#131620" stroke="#273047" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#f8fafc"/>
    <text x="25" y="17" class="subtag-text">Ürün Geliştirici</text>
  </g>

  <!-- Tech Badges Bar (Bottom) -->
  <g transform="translate(36, 142)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="118" height="30" rx="8" fill="#131620" stroke="#273047" stroke-width="1"/>
      <text x="14" y="19" class="tag-text">TypeScript / JS</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(126, 0)">
      <rect width="90" height="30" rx="8" fill="#131620" stroke="#273047" stroke-width="1"/>
      <text x="14" y="19" class="tag-text">Rust / Win32</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(224, 0)">
      <rect width="112" height="30" rx="8" fill="#131620" stroke="#273047" stroke-width="1"/>
      <text x="14" y="19" class="tag-text">Swift / macOS</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(344, 0)">
      <rect width="84" height="30" rx="8" fill="#131620" stroke="#273047" stroke-width="1"/>
      <text x="14" y="19" class="tag-text">Electron</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(436, 0)">
      <rect width="116" height="30" rx="8" fill="#131620" stroke="#273047" stroke-width="1"/>
      <text x="14" y="19" class="tag-text">WCAG 2.2 AA</text>
    </g>
    <!-- Tag 6 -->
    <g transform="translate(560, 0)">
      <rect width="144" height="30" rx="8" fill="#131620" stroke="#273047" stroke-width="1"/>
      <text x="14" y="19" class="tag-text">Web Components</text>
    </g>
    <!-- Tag 7 -->
    <g transform="translate(712, 0)">
      <rect width="76" height="30" rx="8" fill="#131620" stroke="#273047" stroke-width="1"/>
      <text x="14" y="19" class="tag-text">Preact</text>
    </g>
  </g>
</svg>
